name: Build Android APK

# Runs on every push (and by hand from the Actions tab). Each successful run publishes
# a GitHub Release with HabitTracker.apk attached, so the newest APK is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/HabitTracker.apk
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HabitTracker.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: HabitTracker-1.0.${{ github.run_number }}
          path: HabitTracker.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Habit Tracker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: HabitTracker.apk
          body: |
            📲 **Install on Android:** tap **HabitTracker.apk** below → open the download → allow "Install unknown apps" for your browser if asked → **Install**.

            Already have it? Just install this one over the top. Your habits and streaks are kept.

            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.
